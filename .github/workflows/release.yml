name: CI / Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-flight runs of the same PR (so updates don't pile up runners), but
# never cancel a push-to-main run — releases are precious.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------------------------------
  # build: uber-JAR + examples zip + recipient smoke (./gradlew runQuickstart).
  #
  # The zip is built from a fresh checkout of gq-godark/gdx-java-sdk@<ref>
  # where <ref> is read from sdk/UPSTREAM_REF in this repo. The vendored
  # sdk/lib/godark-*-all.jar is parity-checked (SHA256) against the freshly
  # built upstream shadowJar inside scripts/package.sh. Local edits to sdk/
  # cannot reach the released artifact.
  #
  # Required secrets:
  #   GDX_APP_ID            — GitHub App id (the GDX_APP)
  #   GDX_APP_PRIVATE_KEY   — GitHub App private key (PEM)
  #
  # The app must be installed on gq-godark with read access to gdx-java-sdk
  # AND gdx-proto.
  # --------------------------------------------------------------------------
  build:
    name: Build JAR + examples zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
      bundle_name: ${{ steps.ver.outputs.bundle_name }}
      pinned_ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Checkout examples repo
        uses: actions/checkout@v4

      - name: Verify GitHub App secrets are configured
        env:
          APP_ID: ${{ secrets.GDX_APP_ID }}
          APP_KEY: ${{ secrets.GDX_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$APP_ID" ]  || missing+=(GDX_APP_ID)
          [ -n "$APP_KEY" ] || missing+=(GDX_APP_PRIVATE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            echo "::error::Install the GDX_APP GitHub App credentials under repo Settings -> Secrets and variables -> Actions, and ensure the app is installed on gq-godark with contents:read on gdx-java-sdk + gdx-proto."
            exit 1
          fi

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Mint GDX_APP token (scoped to upstream + submodule)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GDX_APP_ID }}
          private-key: ${{ secrets.GDX_APP_PRIVATE_KEY }}
          owner: gq-godark
          repositories: gdx-java-sdk,gdx-proto

      - name: Read pinned upstream ref
        id: pin
        run: |
          if [ ! -f sdk/UPSTREAM_REF ]; then
            echo "::error::sdk/UPSTREAM_REF missing — run scripts/refresh_sdk.sh and commit."
            exit 1
          fi
          ref="$(tr -d '[:space:]' < sdk/UPSTREAM_REF)"
          if [ -z "$ref" ]; then
            echo "::error::sdk/UPSTREAM_REF is empty"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Pinned upstream ref: ${ref}"

      - name: Checkout pinned upstream gdx-java-sdk
        uses: actions/checkout@v4
        with:
          repository: gq-godark/gdx-java-sdk
          ref: ${{ steps.pin.outputs.ref }}
          path: upstream
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          submodules: recursive

      - name: Checkout gdx-proto
        uses: actions/checkout@v4
        with:
          repository: gq-godark/gdx-proto
          path: gdx-proto
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Ensure gdx-proto checkout is available
        run: |
          if [ ! -f gdx-proto/proto/gdx/common/v1/types.proto ]; then
            echo "::error::gdx-proto/proto/gdx/common/v1/types.proto missing — ensure GDX_APP has contents:read on gq-godark/gdx-proto"
            exit 1
          fi

      - name: Compute version + bundle name
        id: ver
        run: |
          base="$(grep '^version=' upstream/gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          if [ -z "$base" ]; then
            echo "::error::Could not parse 'version=' from upstream/gradle.properties"
            exit 1
          fi
          version="v${base}-build.${{ github.run_number }}"
          bundle_name="godark-java-sdk-${version}"
          echo "version=${version}"         >> "$GITHUB_OUTPUT"
          echo "bundle_name=${bundle_name}" >> "$GITHUB_OUTPUT"
          echo "Building ${bundle_name}.zip (godark==${base} from upstream pin ${{ steps.pin.outputs.ref }})"

      - name: Build zip via scripts/package.sh
        env:
          UPSTREAM_SRC: ${{ github.workspace }}/upstream
          GDX_PROTO_ROOT: ${{ github.workspace }}/gdx-proto/proto
        run: bash scripts/package.sh ${{ steps.ver.outputs.bundle_name }}

      - name: Recipient smoke (unzip + runQuickstart, no creds)
        run: |
          mkdir -p /tmp/recip
          unzip -q ${{ steps.ver.outputs.bundle_name }}.zip -d /tmp/recip
          cd /tmp/recip/${{ steps.ver.outputs.bundle_name }}/examples
          chmod +x gradlew

          # Quickstart requires GODARK_API_KEY_ID + GODARK_API_SECRET. CI has
          # no testnet creds, so we expect it to print the missing-credentials
          # message and exit non-zero. That outcome proves: (a) the shipped
          # uber-jar resolved on the classpath, (b) examples compiled against
          # it, (c) ExamplesEnv parsed, and (d) main() reached the credential
          # check. Any *other* failure mode (compile error, NoClassDefFound,
          # etc.) still fails this step.
          out="$(./gradlew --no-daemon runQuickstart 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "Missing credentials: set GODARK_API_KEY_ID" || {
            echo "::error::quickstart did not produce expected missing-credentials message — see log above"
            exit 1
          }

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.bundle_name }}
          path: ${{ steps.ver.outputs.bundle_name }}.zip
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # release: tag + GitHub release attached to the prebuilt zip.
  # Only on push to main, after build passes.
  # --------------------------------------------------------------------------
  release:
    name: Create GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt zip from build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: ./release-asset

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ./release-asset/${{ needs.build.outputs.bundle_name }}.zip
          body: |
            **Automated release** built from commit `${{ github.sha }}`.

            Prebuilt `godark-*-all.jar` uber-JAR and minimal Gradle examples for
            the GoDark Java SDK.

            ## Install

            1. Download `${{ needs.build.outputs.bundle_name }}.zip` from the assets below.
            2. Unzip and follow `README.md` inside the bundle:

               ```bash
               unzip ${{ needs.build.outputs.bundle_name }}.zip
               cd ${{ needs.build.outputs.bundle_name }}
               cd examples && chmod +x gradlew && ./gradlew runQuickstart
               ```

            See `README.md` and `SDK_REFERENCE.md` inside the bundle for the
            full integration docs.
