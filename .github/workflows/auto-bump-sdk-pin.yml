name: Auto-bump SDK pin

# Listener: triggered by gdx-java-sdk notify-examples.yml (repository_dispatch) or manually.
# Clones gdx-java-sdk at the dispatched SHA, runs scripts/refresh_sdk.sh, opens a rolling PR.

on:
  repository_dispatch:
    types: [gdx-sdk-changed]
  workflow_dispatch:
    inputs:
      sdk_sha:
        description: gdx-java-sdk commit SHA to vendor (for manual testing)
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump:
    name: Refresh sdk/lib + open PR if changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GDX_APP_ID }}
          private-key: ${{ secrets.GDX_APP_PRIVATE_KEY }}
          owner: gq-godark
          repositories: gdx-java-sdk-examples,gdx-java-sdk

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve SDK SHA
        id: sha
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sdk_sha }}
          INPUT_SHA: ${{ inputs.sdk_sha }}
        run: |
          SHA="${DISPATCH_SHA:-$INPUT_SHA}"
          if [ -z "$SHA" ]; then
            echo "::error::No sdk_sha in dispatch payload and no workflow_dispatch input."
            exit 1
          fi
          echo "sdk_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Vendoring gdx-java-sdk@${SHA}"

      - name: Clone gdx-java-sdk at SHA
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_SHA: ${{ steps.sha.outputs.sdk_sha }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/gq-godark/gdx-java-sdk.git" /tmp/gdx-java-sdk
          git -C /tmp/gdx-java-sdk checkout "$SDK_SHA"

      - name: Refresh vendored artifacts
        run: bash scripts/refresh_sdk.sh /tmp/gdx-java-sdk

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- sdk/; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No changes after refresh."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- sdk/
          fi

      - name: Configure git + open rolling PR
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: auto/bump-sdk-pin
          SDK_SHA: ${{ steps.sha.outputs.sdk_sha }}
        run: |
          set -euo pipefail
          git config user.name "gdx-app[bot]"
          git config user.email "gdx-app[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add sdk/
          git commit -m "chore(sdk): vendor godark jar from gdx-java-sdk@${SDK_SHA}

          Auto-generated by .github/workflows/auto-bump-sdk-pin.yml."
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr view "$BRANCH" --json url --jq .url
          else
            gh pr create \
              --title "auto: bump vendored SDK to ${SDK_SHA:0:7}" \
              --body "Vendors \`sdk/lib/godark-*-all.jar\` from \`gq-godark/gdx-java-sdk@${SDK_SHA}\`.

          Merge to \`main\` to cut a new GitHub Release ZIP." \
              --base main \
              --head "$BRANCH" \
              --label automation
          fi
